defaults:
  - config
  - override simulator: isaaclab
  - _self_

planner:
  target_prob: 0.35

# Scenario generation
n_scenarios: 10
n_obstacles: 3
bin_size: 0.3
seed: 42
stackable: false
difficult_spawn: false

# Override config.yaml defaults for isaaclabmpc compatibility
wall_thickness: 0.02
friction: 1.2
parallel_envs: 8
viewer: headless

# Puzzle solver child process (null = wait indefinitely)
puzzle_timeout_s: null

# Single-scenario mode: skip generation, run puzzle planning + MPC on one YAML
# Usage: python pipeline.py --config-name=pipeline scenario_file=conf/scenario/generated/scenario_0000.yaml
scenario_file: null

# Server mode: pull env setup from the running planner instead of a YAML.
# Usage: python pipeline.py --config-name=pipeline scenario_source=server
scenario_source: server
server_scenario_name: server_scenario

# Resume mode: skip scenario generation + puzzle planning, run MPC only
# Usage: python pipeline.py --config-name=pipeline resume=true resume_dir=outputs/<run_id>
resume: false
resume_dir: null

# IsaacLab MPC subprocesses
isaaclabmpc_timeout_s: 300
isaaclabmpc_n_steps: 10000
isaaclabmpc_dir: /home/jack/research/isaaclabmpc/examples/ur16e_reach_stand_blocks_jack
show_mpc_planner_viewer: false  # open Isaac viewer during puzzle planning (planner.py / puzzle solver)
show_mpc_world_viewer: true     # open Isaac viewer during MPC execution (world.py)

# Video recording (IsaacLab only; requires omni.replicator — uses ISAACLAB_ENABLE_CAMERAS)
record_video: true

# Output / WandB
output_dir: outputs
wandb_project: bin-clearing-pipeline
wandb_entity: null
wandb_run_name: null

hydra:
  run:
    dir: .
  output_subdir: null
  job_logging:
    root:
      level: WARNING
