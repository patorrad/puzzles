n_obstacles: 26
n_z_levels: 3
target_z_level: 1   # target is the center block of the 3×3×3 cube
bin_size: 0.6
friction: 1.2

# 3×3×3 cube of objects centered in the bin.
# 9 columns at (NS, EW) ∈ {0.15, 0.25, 0.35}², each stacked 3 high.
# Column spacing = 2×obj_size = 0.10 m (well above the 1.05×obj_size min separation).
# z-levels: floor=0.025, middle=0.075, top=0.125  (obj_h + i × obj_size)
# Target occupies the exact center: (0.25, 0.25, 0.075). Symmetric grid — positions unchanged.
# Obstacles sorted by ascending z so lower objects are spawned before upper ones.
initial_state:
  target_pos: [0.25, 0.25, 0.075]
  target_quat: [1.0, 0.0, 0.0, 0.0]
  obstacles:
    # --- floor layer (z = 0.025) ---
    - pos: [0.15, 0.15, 0.025]
      quat: [1.0, 0.0, 0.0, 0.0]
    - pos: [0.15, 0.25, 0.025]
      quat: [1.0, 0.0, 0.0, 0.0]
    - pos: [0.15, 0.35, 0.025]
      quat: [1.0, 0.0, 0.0, 0.0]
    - pos: [0.25, 0.15, 0.025]
      quat: [1.0, 0.0, 0.0, 0.0]
    - pos: [0.25, 0.25, 0.025]   # directly under target
      quat: [1.0, 0.0, 0.0, 0.0]
    - pos: [0.25, 0.35, 0.025]
      quat: [1.0, 0.0, 0.0, 0.0]
    - pos: [0.35, 0.15, 0.025]
      quat: [1.0, 0.0, 0.0, 0.0]
    - pos: [0.35, 0.25, 0.025]
      quat: [1.0, 0.0, 0.0, 0.0]
    - pos: [0.35, 0.35, 0.025]
      quat: [1.0, 0.0, 0.0, 0.0]
    # --- middle layer (z = 0.075) — 8 objects, target is the 9th ---
    - pos: [0.15, 0.15, 0.075]
      quat: [1.0, 0.0, 0.0, 0.0]
    - pos: [0.15, 0.25, 0.075]
      quat: [1.0, 0.0, 0.0, 0.0]
    - pos: [0.15, 0.35, 0.075]
      quat: [1.0, 0.0, 0.0, 0.0]
    - pos: [0.25, 0.15, 0.075]
      quat: [1.0, 0.0, 0.0, 0.0]
    - pos: [0.25, 0.35, 0.075]
      quat: [1.0, 0.0, 0.0, 0.0]
    - pos: [0.35, 0.15, 0.075]
      quat: [1.0, 0.0, 0.0, 0.0]
    - pos: [0.35, 0.25, 0.075]
      quat: [1.0, 0.0, 0.0, 0.0]
    - pos: [0.35, 0.35, 0.075]
      quat: [1.0, 0.0, 0.0, 0.0]
    # --- top layer (z = 0.125) ---
    - pos: [0.15, 0.15, 0.125]
      quat: [1.0, 0.0, 0.0, 0.0]
    - pos: [0.15, 0.25, 0.125]
      quat: [1.0, 0.0, 0.0, 0.0]
    - pos: [0.15, 0.35, 0.125]
      quat: [1.0, 0.0, 0.0, 0.0]
    - pos: [0.25, 0.15, 0.125]
      quat: [1.0, 0.0, 0.0, 0.0]
    - pos: [0.25, 0.25, 0.125]   # directly above target
      quat: [1.0, 0.0, 0.0, 0.0]
    - pos: [0.25, 0.35, 0.125]
      quat: [1.0, 0.0, 0.0, 0.0]
    - pos: [0.35, 0.15, 0.125]
      quat: [1.0, 0.0, 0.0, 0.0]
    - pos: [0.35, 0.25, 0.125]
      quat: [1.0, 0.0, 0.0, 0.0]
    - pos: [0.35, 0.35, 0.125]
      quat: [1.0, 0.0, 0.0, 0.0]
