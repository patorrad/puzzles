defaults:
  - config
  - override simulator: isaaclab
  - _self_
# Environment
n_obstacles: 20
parallel_envs: 16
difficult_spawn: true

# Benchmark
seed: 0
n_runs: 20
base_seed: 0          # run i uses seed = base_seed + i
n_z_levels: 2
stackable: true
bin_size: 0.4

viewer: headless

# Video (IsaacLab only)
record_video: true
video_dir: "benchmark_videos"

# Results database (SQLite)
db_path: null             # set to a path like "results/paper.db" to enable logging

# WandB
wandb_project: "bin-clearing-benchmark"
wandb_entity: null    # set to your username/org, or leave null for default
wandb_run_name: null  # auto-generated if null

hydra:
  run:
    dir: .
  output_subdir: null
  job_logging:
    root:
      level: WARNING
