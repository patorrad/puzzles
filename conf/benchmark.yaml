defaults:
  - config
  - override simulator: isaaclab
  - _self_
# Environment
n_obstacles: 5
parallel_envs: 1
difficult_spawn: true

# Benchmark
seed: 50
n_runs: 50
base_seed: 0          # run i uses seed = base_seed + i
skip_runs: 0          # skip the first N runs (for resuming interrupted benchmarks)
n_z_levels: 2
stackable: true
bin_size: 0.4

viewer: headless

# Video (IsaacLab only)
record_video: true
video_dir: "benchmark_videos"

# Results database (SQLite)
db_path: null             # set to a path like "results/paper.db" to enable logging

# CSV output (matches eval_comparison.py EpisodeResult schema; appends if file exists)
csv_path: null            # set to a path like "results/benchmark.csv" to enable

# Solution saving (for robotic execution)
solutions_dir: null       # set to a directory path to save per-episode solution JSONs
collect_data_dir: null    # set to a directory path to save per-episode MORE tree node data (.pt)

# WandB
wandb_project: "bin-clearing-benchmark"
wandb_entity: null    # set to your username/org, or leave null for default
wandb_run_name: null  # auto-generated if null

hydra:
  run:
    dir: .
  output_subdir: null
  job_logging:
    root:
      level: WARNING
