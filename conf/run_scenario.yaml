defaults:
  - config
  - override scenario: cube27   # optional: pass scenario=<name> to use a preset environment
  - _self_

# Environment

planner:
  target_prob: 0.2

parallel_envs: 512
push_steps: 256
verify_push_steps: 512   # null = same as push_steps; integer = use this for verify + video
save: "cube27_plan.json"
# Runtime
pause_before_verify: true