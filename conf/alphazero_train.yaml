defaults:
  - simulator: isaaclab
  - reward: default
  - _self_

# Environment knobs (passed to build_env)
n_obstacles: 20
bin_size: 0.4
bin_size_factor: 1
stackable: true
difficult_spawn: false
friction: 1.0
obj_size: 0.05
obstacle_shapes: null  # null=all cubes; list e.g. [L,T,S,Z,I,O,J,cube]; available: cube I O T S Z L J
n_z_levels: 2
target_z_level: null
force_obstacle_on_target: false
push_steps: 256
substeps: 4
wall_thickness: 0.25
parallel_envs: 1
seed: 0
debug: false
viewer: headless

# Training
net_arch: mlp   # 'mlp' | 'resnet' | 'transformer' (transformer is solver-only; stacker falls back to resnet)
n_iterations: 100
episodes_per_iter: 32
train_steps_per_iter: 100
batch_size: 128
buffer_size: 50000
lr: 1.0e-3
weight_decay: 1.0e-4
checkpoint_every: 25
output_dir: outputs/alphazero_n20_bin04_stacked
device: cpu
use_wandb: true
log_video: true   # capture a self-play replay video at every checkpoint and upload to wandb (isaaclab only)
wandb_project: puzzle-alphazero
wandb_entity: null
wandb_run_name: null

random_stacker: false   # if true, skip adversarial StackerNet and use env.reset() for random initial states
resume_from: null       # path to a .pt checkpoint to resume from (e.g. outputs/alphazero/alphazero_latest.pt)

selfplay:
  n_simulations_solver: 200
  n_simulations_stacker: 100
  max_depth: 10
  temperature_init: 1.0
  temperature_final: 1.0e-3 #0.3 #1.0e-3
  temperature_decay_after: 4 #8 #4
  c_puct: 1.5 #2.5 #1.5
  dirichlet_alpha: 0.3 #0.15 #0.3
  dirichlet_eps: 0.25 #0.4 #0.25
  settle_steps: 10
  gamma: 0.95
  reward_scale: 2.0  # divides env._compute_reward for value targets; 0 = sparse ±1 fallback

hydra:
  run:
    dir: .
  output_subdir: null
  job_logging:
    root:
      level: WARNING
