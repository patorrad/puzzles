defaults:
  - simulator: isaaclab
  - planner: mcts
  - reward: default
  - scenario: null   # optional: pass scenario=<name> to use a preset environment
  - _self_

# Environment
n_obstacles: 20
bin_size: null             # null = auto-scale with n_obstacles; set a float (e.g. 0.5) for a fixed size
bin_size_factor: 1      # auto bin_size = (n_obstacles+1) * OBJ_SIZE * this factor (ignored if bin_size is set)
stackable: false
difficult_spawn: false
debug: false
friction: 1.0
obj_size: 0.05   # object cube side length (metres) — one cell of any shape
obstacle_shapes: null  # null=all cubes; list of shape names e.g. [L, T, cube]; available: cube I O T S Z L J
n_z_levels: 1
target_z_level: null  # null = floor; integer forces the target to that z level (0=floor, 1=stacked, ...)
force_obstacle_on_target: false  # if true, one obstacle is placed on top of the target (requires n_z_levels > target_z_level + 1)
push_steps: 256
verify_push_steps: 256   # null = same as push_steps; integer = use this for verify + video
substeps: 4
wall_thickness: 0.25
parallel_envs: 64
seed: null


# Runtime
verify_threshold: 0.75   # fraction of envs that must succeed to accept a plan
min_verify_envs: 16      # minimum envs allocated per plan during multi-plan verification
viewer: always        # headless | replay | verify | always
pause_before_verify: false
save: null          # generic solution save path (any use)
mppi_output: null   # save solution JSON for the MPPI robot-arm controller
replay_file: null   # internal: set by subprocess replay launch


hydra:
  run:
    dir: .
  output_subdir: null
  job_logging:
    root:
      level: WARNING
